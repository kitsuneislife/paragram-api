# Local development dependencies. The API itself runs with `go run`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paragram
      POSTGRES_PASSWORD: paragram
      POSTGRES_DB: paragram
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paragram"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  minio:
    # Pinned: MinIO stopped publishing new community images in 2025.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: paragram
      MINIO_ROOT_PASSWORD: paragram-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  postgres:
  minio:

openapi: 3.1.0
info:
  title: Paragram API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. Rules shared by every endpoint
    (errors, pagination, auth, idempotency) are in docs/api-conventions.md.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      summary: Liveness
      description: The process is running.
      operationId: healthz
      tags: [ops]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      summary: Readiness
      description: Postgres and Redis are reachable.
      operationId: readyz
      tags: [ops]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Problem"

  /v1/auth/register:
    post:
      summary: Create an account
      description: Starts a session for the new user. Rate limited per IP.
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._]{1,30}$", description: Stored lowercase }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                display_name: { type: string, maxLength: 50 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/login:
    post:
      summary: Log in
      description: Starts a new session (one per device). Rate limited per IP.
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: Username or email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/refresh:
    post:
      summary: Rotate tokens
      description: |
        Returns a new token pair and invalidates the refresh token sent.
        Sending an already used refresh token revokes the whole session.
        Rate limited per IP.
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/logout:
    post:
      summary: Log out
      description: Ends the session of the access token used. Other devices stay logged in.
      operationId: logout
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      summary: Current user
      operationId: getMe
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The caller, including private fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Edit own profile
      description: Omitted fields stay unchanged. An empty string clears bio, website or display_name.
      operationId: updateMe
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._]{1,30}$", description: Stored lowercase. }
                display_name: { type: string, maxLength: 50 }
                bio: { type: string, maxLength: 150 }
                website: { type: string, maxLength: 200, description: "http(s) URL or empty." }
                avatar_media_id:
                  type: string
                  description: >
                    ID of an uploaded media with purpose avatar. It becomes the avatar once
                    processed; until then the old one stays. Empty string removes the avatar.
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}:
    get:
      summary: User by ID
      operationId: getUser
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public profile (email only when it is the caller)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/users/by-username/{username}:
    get:
      summary: User by username
      operationId: getUserByUsername
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public profile (email only when it is the caller)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/media:
    post:
      summary: Start an upload
      description: >
        Creates a pending media and returns a presigned URL. PUT the file (JPEG, PNG or GIF,
        up to 20 MiB) to it before it expires, then attach the media (PATCH /v1/me avatar_media_id).
        Attaching queues processing; the media is usable once its status is ready.
      operationId: createMedia
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [post, avatar] }
      responses:
        "201":
          description: Pending media and where to upload it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Media"
                  - type: object
                    required: [upload_url, upload_expires_at]
                    properties:
                      upload_url: { type: string, format: uri, description: "PUT the file here." }
                      upload_expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/media/{id}:
    get:
      summary: Own media
      operationId: getMedia
      tags: [media]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Media and, once ready, its URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not the caller's }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login, register or refresh. Expires in 15 minutes.

  headers:
    X-Request-Id:
      description: Request ID, echoed from the client or generated. Appears in logs.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }

  responses:
    Problem:
      description: Error (RFC 9457)
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://paragram.dev/errors/not-found"]
        title: { type: string, examples: [Not Found] }
        status: { type: integer, examples: [404] }
        detail: { type: string }
        errors:
          type: array
          description: Present on 422, one entry per invalid field.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, examples: [username] }
              code: { type: string, examples: [taken, invalid, required, too_long, too_short] }

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds, examples: [900] }

    AuthResult:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, username, display_name, bio, website, posts_count, followers_count, following_count, created_at, avatar]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        posts_count: { type: integer }
        followers_count: { type: integer }
        following_count: { type: integer }
        created_at: { type: string, format: date-time }
        avatar:
          oneOf:
            - $ref: "#/components/schemas/MediaURLs"
            - type: "null"
        email: { type: string, format: email, description: Only present for the caller themself }

    MediaURLs:
      type: object
      required: [thumb, medium, full]
      description: JPEGs bounded to 320, 1080 and 2048 px on the long side (never upscaled).
      properties:
        thumb: { type: string, format: uri }
        medium: { type: string, format: uri }
        full: { type: string, format: uri }

    Media:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, processing, ready, failed]
          description: pending until attached, then processing; failed if the file is not a supported image.
        width: { type: integer, description: Of the full variant, once ready }
        height: { type: integer }
        urls: { $ref: "#/components/schemas/MediaURLs" }

openapi: 3.1.0
info:
  title: Paragram API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. Rules shared by every endpoint
    (errors, pagination, auth, idempotency) are in docs/api-conventions.md.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      summary: Liveness
      description: The process is running.
      operationId: healthz
      tags: [ops]
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      summary: Readiness
      description: Postgres and Redis are reachable.
      operationId: readyz
      tags: [ops]
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Problem"

  /v1/auth/register:
    post:
      summary: Create an account
      description: Starts a session for the new user. Rate limited per IP.
      operationId: register
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._]{1,30}$", description: Stored lowercase }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                display_name: { type: string, maxLength: 50 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/login:
    post:
      summary: Log in
      description: Starts a new session (one per device). Rate limited per IP.
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, description: Username or email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/refresh:
    post:
      summary: Rotate tokens
      description: |
        Returns a new token pair and invalidates the refresh token sent.
        Sending an already used refresh token revokes the whole session.
        Rate limited per IP.
      operationId: refresh
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/logout:
    post:
      summary: Log out
      description: Ends the session of the access token used. Other devices stay logged in.
      operationId: logout
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      summary: Current user
      operationId: getMe
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The caller, including private fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Edit own profile
      description: Omitted fields stay unchanged. An empty string clears bio, website or display_name.
      operationId: updateMe
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9._]{1,30}$", description: Stored lowercase. }
                display_name: { type: string, maxLength: 50 }
                bio: { type: string, maxLength: 150 }
                website: { type: string, maxLength: 200, description: "http(s) URL or empty." }
                avatar_media_id:
                  type: string
                  description: >
                    ID of an uploaded media with purpose avatar. It becomes the avatar once
                    processed; until then the old one stays. Empty string removes the avatar.
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}:
    get:
      summary: User by ID
      operationId: getUser
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public profile (email only when it is the caller)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/usernames/{username}:
    get:
      summary: User by username
      operationId: getUserByUsername
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public profile (email only when it is the caller)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}/posts:
    get:
      summary: A user's posts, newest first
      description: Others see only ready posts; the author also sees those still processing or failed.
      operationId: listUserPosts
      tags: [posts]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}/follow:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Follow
      description: Idempotent; following twice changes nothing.
      operationId: follow
      tags: [follows]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Following }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem", description: "Following oneself (code: self)" }
    delete:
      summary: Unfollow
      description: Idempotent.
      operationId: unfollow
      tags: [follows]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Not following }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}/followers:
    get:
      summary: Who follows a user, newest first
      operationId: listFollowers
      tags: [follows]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/users/{id}/following:
    get:
      summary: Who a user follows, newest first
      operationId: listFollowing
      tags: [follows]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/feed:
    get:
      summary: Home feed
      description: Ready posts by the caller and everyone they follow, newest first.
      operationId: feed
      tags: [posts]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/posts:
    post:
      summary: Create a post
      description: >
        Attaches 1 to 10 uploaded media (purpose post) in carousel order and queues their
        processing. The post is visible to others once every media is ready.
      operationId: createPost
      tags: [posts]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_ids]
              properties:
                caption: { type: string, maxLength: 2200 }
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The post (or the original one, when the Idempotency-Key was used before)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A post
      operationId: getPost
      tags: [posts]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown, or not ready and not the caller's }
    delete:
      summary: Delete own post
      operationId: deletePost
      tags: [posts]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/posts/{id}/like:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Like a post
      description: Idempotent; liking twice changes nothing.
      operationId: like
      tags: [likes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Liked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not ready }
    delete:
      summary: Unlike a post
      description: Idempotent.
      operationId: unlike
      tags: [likes]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Not liked }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not ready }

  /v1/posts/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Comment on a post
      operationId: createComment
      tags: [comments]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2200, description: Trimmed. }
      responses:
        "201":
          description: The comment (or the original one, when the Idempotency-Key was used before)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not ready }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    get:
      summary: A post's comments, oldest first
      operationId: listComments
      tags: [comments]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not ready }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/comments/{id}:
    delete:
      summary: Delete a comment
      description: Allowed to the comment's author and the post's author.
      operationId: deleteComment
      tags: [comments]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not the caller's to delete }

  /v1/media:
    post:
      summary: Start an upload
      description: >
        Creates a pending media and returns a presigned URL. PUT the file (JPEG, PNG or GIF,
        up to 20 MiB) to it before it expires, then attach the media (PATCH /v1/me avatar_media_id).
        Attaching queues processing; the media is usable once its status is ready.
      operationId: createMedia
      tags: [media]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [post, avatar] }
      responses:
        "201":
          description: Pending media and where to upload it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Media"
                  - type: object
                    required: [upload_url, upload_expires_at]
                    properties:
                      upload_url: { type: string, format: uri, description: "PUT the file here." }
                      upload_expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/media/{id}:
    get:
      summary: Own media
      operationId: getMedia
      tags: [media]
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Media and, once ready, its URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem", description: Unknown or not the caller's }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login, register or refresh. Expires in 15 minutes.

  headers:
    X-Request-Id:
      description: Request ID, echoed from the client or generated. Appears in logs.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    cursor:
      name: cursor
      in: query
      description: next_cursor from the previous page.
      schema: { type: string }
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Retrying with the same key returns the original result instead of creating again.
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457)
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://paragram.dev/errors/not-found"]
        title: { type: string, examples: [Not Found] }
        status: { type: integer, examples: [404] }
        detail: { type: string }
        errors:
          type: array
          description: Present on 422, one entry per invalid field.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, examples: [username] }
              code: { type: string, examples: [taken, invalid, required, too_long, too_short] }

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds, examples: [900] }

    AuthResult:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, username, display_name, bio, website, posts_count, followers_count, following_count, created_at, avatar]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        posts_count: { type: integer }
        followers_count: { type: integer }
        following_count: { type: integer }
        created_at: { type: string, format: date-time }
        avatar:
          oneOf:
            - $ref: "#/components/schemas/MediaURLs"
            - type: "null"
        followed_by_me:
          type: boolean
          description: Whether the caller follows this user. Present on another user's profile and in follow lists.
        email: { type: string, format: email, description: Only present for the caller themself }

    UserPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: [string, "null"], description: Null at the end of the list. }

    Post:
      type: object
      required: [id, author, media, ready, caption, likes_count, comments_count, liked_by_me, created_at]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/User" }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }
        ready: { type: boolean, description: False until every media is processed. Only the author sees such posts. }
        caption: { type: string }
        likes_count: { type: integer }
        comments_count: { type: integer }
        liked_by_me: { type: boolean }
        created_at: { type: string, format: date-time }

    PostPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        next_cursor: { type: [string, "null"], description: Null at the end of the list. }

    Comment:
      type: object
      required: [id, post_id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/User" }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CommentPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: [string, "null"], description: Null at the end of the list. }

    MediaURLs:
      type: object
      required: [thumb, medium, full]
      description: JPEGs bounded to 320, 1080 and 2048 px on the long side (never upscaled).
      properties:
        thumb: { type: string, format: uri }
        medium: { type: string, format: uri }
        full: { type: string, format: uri }

    Media:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, processing, ready, failed]
          description: pending until attached, then processing; failed if the file is not a supported image.
        width: { type: integer, description: "Of the full variant, once ready" }
        height: { type: integer }
        urls: { $ref: "#/components/schemas/MediaURLs" }

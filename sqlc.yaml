# Generates typed Go from SQL. Schema comes from the goose migrations.
# Run `sqlc generate` after changing a migration or a query, and commit the output.
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: store
        out: internal/db/store
        sql_package: pgx/v5
        emit_empty_slices: true
        rename:
          medium: Media # sqlc singularizes "media" to "medium"
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: timestamptz
            go_type: time.Time
